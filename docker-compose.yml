version: '3.8'

services:
  # Nginx负载均衡器
  nginx:
    image: nginx:alpine
    container_name: uav_nginx
    ports:
      - "6000:6000"  # 无人机连接端口
      - "6001:6001"  # 地面站连接端口
      - "8080:8080"  # Web监控端口
      - "80:80"      # Nginx状态监控端口
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - server1
      - server2
      - server3
    restart: unless-stopped
    networks:
      - uav_network

  # 无人机服务器节点1
  server1:
    build: .
    container_name: uav_server1
    environment:
      - SERVER_ID=1
      - SERVER_PORT=6000
      - WEB_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=power_inspection_2024
      - MYSQL_DATABASE=power_inspection
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    networks:
      - uav_network
    volumes:
      - server1_logs:/app/logs

  # 无人机服务器节点2
  server2:
    build: .
    container_name: uav_server2
    environment:
      - SERVER_ID=2
      - SERVER_PORT=6000
      - WEB_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=power_inspection_2024
      - MYSQL_DATABASE=power_inspection
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    networks:
      - uav_network
    volumes:
      - server2_logs:/app/logs

  # 无人机服务器节点3
  server3:
    build: .
    container_name: uav_server3
    environment:
      - SERVER_ID=3
      - SERVER_PORT=6000
      - WEB_PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=power_inspection_2024
      - MYSQL_DATABASE=power_inspection
    depends_on:
      - redis
      - mysql
    restart: unless-stopped
    networks:
      - uav_network
    volumes:
      - server3_logs:/app/logs

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: uav_redis
    command: redis-server --appendonly yes --requirepass power_inspection_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    networks:
      - uav_network

  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: uav_mysql
    environment:
      MYSQL_ROOT_PASSWORD: power_inspection_2024
      MYSQL_DATABASE: power_inspection
      MYSQL_USER: uav_user
      MYSQL_PASSWORD: uav_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - uav_network
    command: --default-authentication-plugin=mysql_native_password

  # 监控服务 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: uav_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - uav_network

  # 监控可视化 - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: uav_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - uav_network

networks:
  uav_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24

volumes:
  redis_data:
    driver: local
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local
  server1_logs:
    driver: local
  server2_logs:
    driver: local
  server3_logs:
    driver: local
