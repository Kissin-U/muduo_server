# Nginx配置文件 - 无人机集群电力巡检服务器负载均衡
# 基于TCP Stream模块实现MAVLink协议的负载均衡

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

stream {
    # 定义无人机服务器集群
    upstream uav_servers {
        least_conn;  # 最少连接数负载均衡策略
        server 192.168.1.10:6000 weight=3 max_fails=2 fail_timeout=30s;
        server 192.168.1.11:6000 weight=3 max_fails=2 fail_timeout=30s;
        server 192.168.1.12:6000 weight=2 max_fails=2 fail_timeout=30s;
    }
    
    # 无人机连接负载均衡
    server {
        listen 6000;
        proxy_pass uav_servers;
        proxy_timeout 1s;
        proxy_responses 1;
        proxy_connect_timeout 1s;
        
        # 启用会话保持 - 基于客户端IP
        proxy_bind $remote_addr transparent;
        
        # 日志配置
        access_log /var/log/nginx/uav_access.log;
        error_log /var/log/nginx/uav_error.log;
    }
    
    # 地面站连接负载均衡
    upstream ground_station_servers {
        ip_hash;  # 基于IP的会话保持策略
        server 192.168.1.10:6001 max_fails=2 fail_timeout=30s;
        server 192.168.1.11:6001 max_fails=2 fail_timeout=30s;
        server 192.168.1.12:6001 max_fails=2 fail_timeout=30s;
    }
    
    server {
        listen 6001;
        proxy_pass ground_station_servers;
        proxy_timeout 3s;
        proxy_responses 1;
        proxy_connect_timeout 3s;
        
        # 地面站连接保持时间更长
        proxy_socket_keepalive on;
        
        # 日志配置
        access_log /var/log/nginx/gs_access.log;
        error_log /var/log/nginx/gs_error.log;
    }
    
    # Web监控接口负载均衡
    upstream web_servers {
        least_conn;
        server 192.168.1.10:8080 max_fails=2 fail_timeout=30s;
        server 192.168.1.11:8080 max_fails=2 fail_timeout=30s;
        server 192.168.1.12:8080 max_fails=2 fail_timeout=30s;
    }
    
    server {
        listen 8080;
        proxy_pass web_servers;
        proxy_timeout 5s;
        proxy_responses 1;
        proxy_connect_timeout 3s;
        
        # Web接口日志
        access_log /var/log/nginx/web_access.log;
        error_log /var/log/nginx/web_error.log;
    }
}

# HTTP配置 - 用于Nginx状态监控
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # Nginx状态监控页面
    server {
        listen 80;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 192.168.1.0/24;
            deny all;
        }
        
        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # 负载均衡状态页面
        location /upstream_status {
            return 200 "Upstream servers status check\n";
            add_header Content-Type text/plain;
        }
    }
}
